name: CI

on:
  push:
    branches: ["**"]   # every branch, not tags (the Release workflow covers those)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ebt_rust
      - name: Install (CPU torch first, then the package with its extension)
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[test]"
      - name: Python tests
        run: python -m pytest tests -q
      - name: Rust tests
        run: cargo test --profile perf
        working-directory: ebt_rust
